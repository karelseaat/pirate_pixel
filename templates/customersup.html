<!doctype html>
<html>
{{ include partials/head_partial.html }}

<body>
  {{ include partials/navigation_partial.html }}

  <div class="container">
    <h2 class="title">{{ pagetitle }}</h2>
    <form action="/customersup" method="post">
    {{ if chatcontent }}
      <div id='chatarea'> {{ chatcontent }} </div>
    {{ else }}
      <div id='chatarea'> nothing yet</div>
    {{ end }}
    {{ if chatid }}
      <input type="hidden" name="chatid" value="{{ chatid }}">
      <input type="hidden" name="chatid_validator" value="required">
    {{ end }}

    <div><label>[[ Question ]]:</label> <input class="input" type="text" name="question"></div>

    <input type="hidden" name="question_validator" value="required|biggerthen=10">

      <input type="submit" value="Submit">
    </form>
  </div>

  {{ include partials/footer_partial.html }}
</body>

</html>
