<!doctype html>
<html>
{{ include partials/head_partial.html }}

<body>
  {{ include partials/navigation_partial.html }}

  <div class="container">
    <h2 class="title">{{ pagetitle }}</h2>
    <form action="/connect/custommqtt" method="post">
      <div><label>[[ MQTTADDRESS ]]:</label> <input value="{{ mqtt[MQTTADDRESS] }}"class="input" type="text" name="MQTTADDRESS"></div>
      {{ if postresults }}
        <label class="error">{{ postresults[MQTTADDRESS] }}</label>
      {{ end }}
      <div><label>[[ USERNAME ]]:</label> <input value="{{ mqtt[MQTTUSERNAME] }}" class="input" type="text" name="MQTTUSERNAME"></div>
      {{ if postresults }}
        <label class="error">{{ postresults[MQTTUSERNAME] }}</label>
      {{ end }}
      <div><label>[[ MQTTPASSWORD ]]:</label> <input class="input" type="password" name="MQTTPASSWORD"></div>

      <input type="hidden" name="MQTTADDRESS_validator" value="required|biggerthen=6">
      <input type="hidden" name="MQTTUSERNAME_validator" value="required|biggerthen=3">
      <input type="hidden" name="MQTTPASSWORD_validator" value="notrequired">
      <input type="submit" value="Submit">
    </form>
  </div>

  {{ include partials/footer_partial.html }}
</body>

</html>
