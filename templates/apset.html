<!doctype html>
<html>
{{ include partials/head_partial.html }}

<body>
  {{ include partials/navigation_partial.html }}
  <div class="container">
    <h2 class="title">{{ pagetitle }}</h2>
    <form action="/config/apset" method="post">
      <!-- <div><label>SSID:</label> <input value="{{ accespoint[WIFISSID] }}" class="input" type="text" name="WIFISSID"><label class="error">{{ postresults[WIFISSID] }}</label></div> -->


      <div><label>[[ SSID ]]:</label>
        <select name="WIFISSID">
          {{ for key,val in accesspoints }}
            {{ if key == selected }}
              <option selected value='{{ val }}'>{{ key }}</option>
            {{ else }}
              <option value='{{ val }}'>{{ key }}</option>
            {{ end }}
          {{ end }}
        </select>
        {{ if postresults }}
          <label class="error">{{ postresults[WIFISSID] }}</label>
        {{ end }}
      </div>

      <div><label>[[ WIFIPASSWD ]]:</label> <input value="" class="input" type="password" name="WIFIPASSWD">
      {{ if postresults }}
        <label class="error">{{ postresults[WIFIPASSWD] }}</label>
      {{ end }}
      </div>

      <input type="hidden" name="WIFISSID_validator" value="required">
      <input type="hidden" name="WIFIPASSWD_validator" value="required|biggerthen=3">
      <input type="submit" value="Submit">
    </form>
  </div>
  {{ include partials/footer_partial.html }}
</body>

</html>
