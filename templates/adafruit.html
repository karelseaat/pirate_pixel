<!doctype html>
<html>
{{ include partials/head_partial.html }}

<body>
  {{ include partials/navigation_partial.html }}

  <div class="container">
    <h2 class="title">{{ pagetitle }}</h2>
    <form action="/connect/adafruitmqtt" method="post">

      <div><label>[[ User name ]]:</label> <input value="{{ ADAUSERNAME }}" class="input" type="text" name="ADAUSERNAME"></div>
      {{ if postresults }}
        <label class="error">{{ postresults[ADAUSERNAME] }}</label>
      {{ end }}
      <div><label>[[ Key ]]:</label> <input value="{{ ADAKEY }}" class="input" type="text" name="ADAKEY"></div>
      {{ if postresults }}
        <label class="error">{{ postresults[ADAKEY] }}</label>
      {{ end }}

      <input type="hidden" name="ADAUSERNAME_validator" value="required|biggerthen=3">
      <input type="hidden" name="ADAKEY_validator" value="required|biggerthen=3">
      <input type="submit" value="Submit">
    </form>
  </div>

  {{ include partials/footer_partial.html }}
</body>

</html>
